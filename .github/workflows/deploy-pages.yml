# Build Next.js static export and publish to GitHub Pages.
#
# Setup (once per repo):
# 1. Settings → Pages → Build and deployment → Source: GitHub Actions
# 2. Push to `main` (or run workflow manually)

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project repos default to basePath /REPO (works at https://user.github.io/REPO/).
      # A custom apex domain (e.g. propiq.lumaticgroup.info) serves files from / so CSS/JS
      # must be under /_next/, not /REPO/_next/. Set repo variable PAGES_ROOT_SITE=true.
      - name: Set asset base path for GitHub Pages
        shell: bash
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [[ "$REPO_LC" == "${OWNER_LC}.github.io" ]]; then
            echo "Publishing user/org site — no base path"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          elif [[ "${{ vars.PAGES_ROOT_SITE }}" == "true" ]]; then
            echo "PAGES_ROOT_SITE — site served at domain root (custom domain), no base path"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "Publishing project site — base path /$REPO"
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
